[workspace]
resolver = "2"
members = [
    "crates/sshdeck-core",
    "crates/sshdeck-terminal",
    "crates/sshdeck-vault",
    "crates/sshdeck-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Dev builds: no debug info. Keeps the target dir small and linking cheap on an
# 8 GB machine. Use `--release` for the real (fast, low-CPU) build.
[profile.dev]
debug = 0
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
