name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Never cancel a run on main: several agents push independently, and
  # cancel-in-progress meant no run on main ever finished, so nothing was
  # actually verified. Superseded PR runs are still cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  pure-rust:
    name: pure rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo fmt --all --check
      # Everything except the GPUI binary, which needs a macOS GUI stack.
      - run: cargo clippy --workspace --exclude sshdeck-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude sshdeck-app

  app:
    name: app (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      # GPUI builds its own Metal renderer, so this job is the slow one; the
      # cache above is what keeps it tolerable.
      - run: cargo clippy -p sshdeck-app --all-targets -- -D warnings
      - run: cargo build -p sshdeck-app
      - run: cargo test -p sshdeck-app
