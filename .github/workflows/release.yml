name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    env:
      # The workspace profile is tuned for a local release build; a 3-core
      # runner cannot afford codegen-units=1 plus thin LTO.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - run: cargo build -p sshdeck-app --release
      - name: Package
        run: |
          set -euo pipefail
          # A bare Mach-O is not a macOS app: it gets no proper window-server
          # identity, no Dock entry, and automation cannot resolve its window.
          # Ship a real .app bundle.
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          APP=target/release/sshdeck.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/sshdeck "$APP/Contents/MacOS/sshdeck"
          sed "s/__VERSION__/$VERSION/" packaging/Info.plist > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          codesign -s - --force --deep "$APP"
          tar -czf sshdeck-macos-arm64.tar.gz -C target/release sshdeck.app
          echo "--- bundle ---"; find "$APP" -type f
          echo "--- sizes ---"; du -h target/release/sshdeck; ls -lh sshdeck-macos-arm64.tar.gz
      # Always upload as a workflow artifact so a manual dispatch (which has no
      # tag) still produces something downloadable via `gh run download`.
      - uses: actions/upload-artifact@v4
        with:
          name: sshdeck-macos-arm64
          path: sshdeck-macos-arm64.tar.gz
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sshdeck-macos-arm64.tar.gz
          generate_release_notes: true
